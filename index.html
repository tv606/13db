<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13Db Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #050508;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Arka Plan Bulanık Poster Görseli */
    .bg-poster {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      filter: blur(25px) brightness(1);
      transform: scale(1.1);
      transition: background-image 0.6s ease-in-out;
      z-index: -2;
      background-color: #0a0a0f;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.2) 0%, rgba(5, 5, 8, 0.9) 100%);
      z-index: -1;
    }

    /* Ana Tasarım Kapsayıcısı */
    .main-container {
      width: 90%;
      max-width: 1000px; /* Ekranın yatayda düzgün yayılması için */
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }

    /* Üst Arama/ID Alanı (Glassmorphism) */
    .search-card {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 18px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background-color: rgba(0, 0, 0, 0.4);
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      background-color: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    button:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      transform: translateY(-1px);
    }

    /* 16:9 Yatay Format Video Oyuncusu (Görseldeki Dikey Hata Düzeltildi) */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Sinema Formatı */
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

   .info-box {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  max-width: 500px;
  padding: 16px 20px;
  
  /* Yumuşak Cam/Koyu Kart Etkisi */
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px 12px 12px 12px;
  
  /* Sol Taraftaki Vurgu Çizgisi */
   /* border-left: 4px solid #00dfd8;*/
  
  /* İnce Parlama ve Derinlik */
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(8px);
}

.info-icon {
  font-size: 1.2rem;
  line-height: 1.5;
}

.info-text {
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  font-style: italic; /* İtalik stil */
  color: #a0aec0; /* Göze hoş gelen yumuşak gri/mavi tonu */
  line-height: 1.6;
  margin: 0;
}

/* "İpucu:" gibi vurgulu kelimeler için dik (normal) ve canlı font */
.info-text strong {
  font-style: normal;
  font-weight: 600;
  color: #00dfd8; /* Vurgu rengiyle aynı neon cyan */
}

  </style>
</head>
<body>

  <!-- Arka Plan Görselleri -->
  <div id="bgPoster" class="bg-poster"></div>
  <div class="bg-overlay"></div>

  <!-- Ana Kapsayıcı -->
  <div class="main-container">
    <div class="info-box">ID girip "Oynat" butonuna basın.</div>
    <!-- Giriş Alanı -->
    <div class="search-card">
      <input type="text" id="imdbInput" placeholder="IMDb ID girin (Örn: tt0088763)" value="tt0088763">
      <button onclick="loadMovie()">Oynat &#9654;</button>
    </div>

    <!-- 16:9 Oynatıcı -->
    <div class="player-wrapper">
      <iframe id="videoPlayer" allowfullscreen></iframe>
    </div>

  </div>

  <script>
    // 🔑 Sadece bu adreste çalışan api key.
    // Eğer boş bırakırsan hazır ücretsiz servis üzerinden poster çekilir.
    const TMDB_API_KEY = "43ddba9df87b2636f3c27ec9f382c85f";

    async function updateBackground(imdbId) {
      const bgPoster = document.getElementById('bgPoster');

      try {
        // API Key ile TMDB'den ilgili filmin arka plan görselini alma
        const response = await fetch(`https://api.themoviedb.org/3/find/${imdbId}?api_key=${TMDB_API_KEY}&external_source=imdb_id`);
        const data = await response.json();
        
        const movie = data.movie_results && data.movie_results[0];

        if (movie && (movie.backdrop_path || movie.poster_path)) {
          const imgPath = movie.backdrop_path || movie.poster_path;
          bgPoster.style.backgroundImage = `url('https://image.tmdb.org/t/p/w1280${imgPath}')`;
        } else {
          // Bulunamazsa yedek API servisini dene
          bgPoster.style.backgroundImage = `url('https://vidsrc.icu/poster/${imdbId}')`;
        }
      } catch (err) {
        // Hata durumunda alternatif resim servisini yükle
        bgPoster.style.backgroundImage = `url('https://vidsrc.icu/poster/${imdbId}')`;
      }
    }

    function loadMovie() {
      const imdbId = document.getElementById('imdbInput').value.trim();
      const iframe = document.getElementById('videoPlayer');

      if (!imdbId) {
        alert('Lütfen geçerli bir IMDb ID girin.');
        return;
      }

      // 1. Vidmody videosunu yükle
      iframe.src = `https://vidmody.com/vs/${imdbId}`;

      // 2. Arka plan görselini güncellenecek fonksiyona yolla
      updateBackground(imdbId);
    }

    // Sayfa açıldığında otomatik başlat
    window.onload = loadMovie;

    // Enter tuş desteği
    document.getElementById('imdbInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') loadMovie();
    });
  </script>

</body>
</html>
